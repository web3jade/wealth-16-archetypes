  <text x="600" y="486" text-anchor="middle" fill="#5c6b86" font-size="22" font-weight="500" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">盲点  柔软的计划也需要硬数字</text>

