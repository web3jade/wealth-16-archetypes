  <text x="600" y="640" text-anchor="middle" fill="#3a4a66" font-size="36" font-weight="500" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">稳扎稳打打长局，持续投入、克制需求、</text>
