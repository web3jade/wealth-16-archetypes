  <text x="600" y="854" text-anchor="middle" fill="#5c6b86" font-size="30" font-weight="500" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">盲点  可能错过可观的成长机会</text>

